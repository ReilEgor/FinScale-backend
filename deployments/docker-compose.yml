services:
  nginx:
    image: nginx:latest
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - keycloak-network
    depends_on:
      - auth-validator-service
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-network
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-network
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    #ports:
    #  - "9080:9080"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    privileged: true
  loki:
    image: grafana/loki:latest
    container_name: loki
    #ports:
    #  - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    #ports:
    #  - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafanadata:/var/lib/grafana
  auth-validator-service:
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.ID}}"
    build:
      context: ..
      dockerfile: services/AuthValidatorService/Dockerfile
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_started
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - keycloak-network
  user-service:
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.ID}}"
    build:
      context: ..
      dockerfile: services/UserService/Dockerfile
    networks:
      - keycloak-network
    environment:
      - DB_SOURCE=${DB_URL_USERS}
    ports:
      - "9000:8080"
    depends_on:
      auth-validator-service:
        condition: service_started
  currency-service:
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.ID}}"
    build:
      context: ..
      dockerfile: services/CurrencyService/Dockerfile
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - COMPARE_FIN_API_KEY=${COMPARE_FIN_API_KEY}
      - COMPARE_FIN_API_URL=${COMPARE_FIN_API_URL}
      - HTTP_PORT=8080
    ports:
      - "9001:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - keycloak-network
    depends_on:
      redis:
        condition: service_healthy
  transaction-service:
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.ID}}"
    build:
      context: ..
      dockerfile: services/TransactionService/Dockerfile
    environment:
      - DB_SOURCE=${DB_URL_TRANSACTIONS}
      - HTTP_PORT=8080
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET=${AWS_BUCKET}
    ports:
        - "9002:8080"
    networks:
      - keycloak-network
    depends_on:
      auth-validator-service:
        condition: service_started
  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "9080:8080"
    volumes:
      - ../services/TransactionService/api/docs/swagger.json:/usr/share/nginx/html/docs/transactionService.json
      - ../services/CurrencyService/api/docs/swagger.json:/usr/share/nginx/html/docs/currencyService.json
    environment:
      URLS: "[
          { url: '/docs/transactionService.json', name: 'Transaction Service' },
          { url: '/docs/currencyService.json', name: 'Currency Service' }
        ]"
networks:
  keycloak-network:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
  grafanadata:
  prometheusdata: