server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }
    location /api/ {
        auth_request /auth-check;

        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_name $upstream_http_x_user_name;

        proxy_set_header X-User-ID $user_id;
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Name $user_name;

        proxy_pass http://user-service:8080;
    }

    location /api/v1/currency/ {
        auth_request /auth-check;

        auth_request_set $user_id $upstream_http_x_user_id;
        proxy_set_header X-User-ID $user_id;

        proxy_pass http://currency-service:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/transaction/ {
        auth_request /auth-check;

        auth_request_set $user_id $upstream_http_x_user_id;
        proxy_set_header X-User-ID $user_id;

        proxy_pass http://transaction-service:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $http_content_type;
    }

    location = /auth-check {
        internal;
        proxy_pass http://auth-validator-service:8080/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Authorization $http_authorization;
    }

}